---
layout: default
---

{{ content }}

{% assign posts = site.posts %}
<h2>最新文章</h2>
{% if posts.size > 0 %}
<ul class="post-list">
  {% for post in posts limit:5 %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
  </li>
  {% endfor %}
</ul>
<p><a href="{{ '/blog/' | relative_url }}">全部文章 →</a></p>
{% else %}
<p class="empty-note">还没有文章。</p>
{% endif %}
