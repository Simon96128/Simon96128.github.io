---
layout: default
---

<div class="page-body post-body">
  <article class="article">
    <a class="back-link" id="backToList" href="{{ '/' | relative_url }}#posts">← 返回</a>
    <h1 class="article-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.categories %} · {{ page.categories | join: " / " }}{% endif %}</p>
    {{ content }}
  </article>
</div>
