<script>
  // 星图导航：给当前页的导航项打上 ✦ 标记
  (function () {
    var mark = function () {
      var path = location.pathname.replace(/\/index\.html$/, "/").replace(/\/+$/, "") || "/";
      document.querySelectorAll(".greedy-nav .visible-links a, .greedy-nav .hidden-links a, .nav__list a").forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href || href.indexOf("://") !== -1) { return; }
        if (href.replace(/\/+$/, "") === path) { a.classList.add("nav-active"); }
      });
    };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mark);
    } else {
      mark();
    }
  })();
</script>

<script>
  // 页面切换兜底：不支持跨文档 View Transitions 的浏览器，改用「淡出 → 跳转 → 入场」
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
    var nativeVT = false;
    try {
      sheets: for (var s = 0; s < document.styleSheets.length; s++) {
        var rules;
        try { rules = document.styleSheets[s].cssRules; } catch (err) { continue; }
        for (var r = 0; r < rules.length; r++) {
          var t = rules[r].cssText || "";
          if (t.indexOf("@view-transition") === 0) { nativeVT = true; break sheets; }
        }
      }
    } catch (err) {}
    if (nativeVT) { return; }

    var go = function (url) {
      var main = document.getElementById("main");
      if (!main) { location.href = url; return; }
      main.style.animation = "cv-page-out .18s ease both";
      setTimeout(function () { location.href = url; }, 170);
    };
    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest ? e.target.closest("a") : null;
      if (!a || a.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
      var href = a.getAttribute("href") || "";
      if (!href || href.charAt(0) === "#") { return; }
      var url = new URL(a.href, location.href);
      if (url.origin !== location.origin || url.href === location.href) { return; }
      e.preventDefault();
      go(url.href);
    }, true);
  })();
</script>
