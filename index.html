---
layout: default
---

<section class="stage" id="stage">
  <div class="stage-art" aria-hidden="true"></div>
  <div class="stage-veil" aria-hidden="true"></div>
  <div class="stage-vignette" aria-hidden="true"></div>
  <div class="stage-hint">滚动 · 沿小路深入</div>
</section>

<section class="arrived">
  <div class="arrived-inner">
    <h2 class="arrived-head">文章</h2>
    <nav class="float-list">
      {% for post in site.posts limit:8 %}
      <a class="float-item" href="{{ post.url | relative_url }}">
        <span class="fi-date">{{ post.date | date: "%Y.%m.%d" }}</span>
        <span class="fi-title">{{ post.title }}</span>
      </a>
      {% endfor %}
    </nav>
    <p class="float-more"><a href="{{ '/blog/' | relative_url }}">全部文章</a></p>
  </div>
</section>
